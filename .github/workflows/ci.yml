name: ci
on:
  push: { branches: [master] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }   # Firestore emulator needs a JRE
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix parent ci
      - run: npm test
      - run: npm --prefix functions test
      - run: npm --prefix parent test
      # vite.config.js refuses to build without Firebase config. CI only checks
      # that the bundle compiles and never deploys it, so placeholders suffice.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: bnhs-sims-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: bnhs-sims-ci
          VITE_FIREBASE_STORAGE_BUCKET: bnhs-sims-ci.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-placeholder
      - run: npm --prefix parent run build && npm --prefix parent run size
      - run: npx firebase emulators:exec --only firestore,auth --project bnhs-sims-ci "npx vitest run -c vitest.rules.config.js && npm --prefix functions run test:emulator"
        env: { GCLOUD_PROJECT: bnhs-sims-ci }
